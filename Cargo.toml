[package]
authors     = ["magic-akari <akari.ccino@gmail.com>"]
description = "A WASM based TOML Formatter"
edition     = "2024"
homepage    = "https://github.com/wasm-fmt/taplo_fmt"
keywords    = ["wasm", "taplo", "TOML", "formatter"]
license     = "MIT OR Apache-2.0"
name        = "taplo_fmt"
readme      = "README.md"
repository  = "https://github.com/wasm-fmt/taplo_fmt"
version     = "0.2.5"

[dependencies]
bridge     = { package = "wasm-fmt-fdk", version = "=0.0.1" }
getrandom  = "0.3"
serde_json = "1"
taplo      = { version = "0.14", features = ["serde"] }

[dev-dependencies]
insta = { version = "1", features = ["glob"] }

[lib]
crate-type = ["cdylib", "rlib"]


[profile.release]
codegen-units = 1
debug         = false
lto           = true
opt-level     = "s"
panic         = "abort"
strip         = "symbols"
